<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tank Arena Login</title>
    <style>
        body {
            background-image: url('/assets/menu_bg.png'); /* Set your custom background image here */
            background-size: cover; /* Covers the entire viewport without distortion */
            background-position: center; /* Centers the image */
            background-repeat: no-repeat; /* Prevents tiling */
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0; /* Removes default margins */
        }
        .login-box {
            background: rgba(30, 41, 59, 0.85); /* Semi-transparent background for better readability over image */
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); /* Optional: Adds a subtle shadow for depth */
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #38bdf8;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #0ea5e9; /* Optional: Hover effect for better UX */
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Tank Arena</h2>
    <form method="post" action="/login">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
